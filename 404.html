<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Page not found | CUSTOM FASHION</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/style.css" />
  <style>
    .error-page {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 40px 20px;
      text-align: center;
    }

    .error-card {
      max-width: 520px;
      padding: clamp(30px, 6vw, 56px);
      border: 1.5px solid var(--line);
      border-radius: var(--radius);
      background: var(--paper);
      box-shadow: var(--shadow-soft);
    }

    .error-code {
      font-family: "Fredoka", sans-serif;
      font-size: clamp(4rem, 16vw, 7rem);
      font-weight: 700;
      line-height: 1;
      color: #fff;
      background: var(--grad-strong);
      border-radius: 24px;
      padding: 4px 0.3em 0.12em;
      display: inline-block;
      transform: rotate(-3deg);
      box-shadow: 0 14px 34px rgba(134, 78, 255, 0.35);
    }

    .error-title {
      margin-top: 26px;
      font-size: clamp(1.5rem, 4vw, 2rem);
    }

    .error-text {
      margin-top: 10px;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <main class="error-page">
    <div class="error-card">
      <span class="error-code">404</span>
      <h1 class="error-title">This page went out of fashion</h1>
      <p class="error-text">The link may be broken, or the piece you were looking for is no longer here.</p>
      <p style="margin-top: 26px">
        <a href="/" class="btn-primary">Back to the shop</a>
      </p>
    </div>
  </main>
</body>
</html>
